name: Starter checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: starter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked whitespace
        run: |
          task_empty_tree=$(git hash-object -t tree -w --stdin < /dev/null)
          git diff --check "$task_empty_tree" HEAD
      - name: Check publishing helper syntax
        run: python3 -m py_compile scripts/publish.py
      # Add application lint, test, and build steps after choosing the stack.
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
